{% extends base_template|default:"base.html" %}
{% block title %}Update PC{% endblock %}

{% block content %}

<div class="page-header">
  <div>
    <h1>Update {{ object.pc_id }}</h1>
    <div class="sub">{{ object.lab.name }}</div>
  </div>
</div>

<div class="card" style="max-width:480px">
  <form method="post" novalidate
        onsubmit="event.preventDefault(); compulabConfirmSubmit(this, {title: 'Update PC status?', text: 'The status of {{ object.pc_id|escapejs }} will be changed.', icon: 'question', confirmButtonText: 'Yes, update', confirmButtonColor: getComputedStyle(document.documentElement).getPropertyValue('--green').trim()}); return false;">
    {% csrf_token %}
    <div class="form-group">
      <label class="form-label" for="{{ form.status.id_for_label }}">Status</label>
      {{ form.status }}
      {% if form.status.errors %}<div class="form-errors">{{ form.status.errors|join:", " }}</div>{% endif %}
    </div>
    <div class="form-actions">
      <button type="submit" class="action-btn primary"><svg class="btn-icon"><use href="#icon-save"/></svg> Save</button>
      <a href="{% url 'pc_status' %}" class="action-btn"><svg class="btn-icon"><use href="#icon-x"/></svg> Cancel</a>
    </div>
  </form>
</div>

{% endblock %}
