{% extends base_template|default:"base.html" %}
{% block title %}Remove Item{% endblock %}

{% block content %}

<div class="page-header">
  <div>
    <h1>Remove inventory item</h1>
    <div class="sub">This action cannot be undone</div>
  </div>
</div>

<div class="card" style="max-width:480px">
  <p style="font-size:13px; margin-bottom:20px; line-height:1.6;">
    Are you sure you want to remove <strong>{{ item.name }}</strong> from {{ item.lab.name }}'s inventory?
  </p>
  <form method="post">
    {% csrf_token %}
    <div class="form-actions">
      <button type="submit" class="action-btn danger"><svg class="btn-icon"><use href="#icon-trash"/></svg> Yes, remove item</button>
      <a href="{% url 'inventory' %}" class="action-btn"><svg class="btn-icon"><use href="#icon-x"/></svg> Cancel</a>
    </div>
  </form>
</div>

{% endblock %}
